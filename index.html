---
layout: default
title: gyutae.dev
---
<main>

  <section class="hero">
    <p class="hero-label">// hello world</p>
    <h1>안녕하세요,<br><span>gyutae</span>입니다.</h1>
    <p class="hero-desc">개발을 배우고, 생각을 기록하고, 만드는 것을 좋아합니다.</p>
    <div class="hero-links">
      <a class="btn btn-primary" href="/blog/">블로그 읽기</a>
      <a class="btn btn-ghost" href="https://github.com/gyutaetae" target="_blank" rel="noopener">GitHub</a>
    </div>
  </section>

  <section>
    <p class="section-label">recent posts</p>
    <div class="post-list">
      {% for post in site.posts limit:5 %}
      <a class="post-item" href="{{ post.url }}" data-tag="{{ post.tag }}">
        <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
        <span class="post-title">{{ post.title }}</span>
        <span class="post-tag">{{ post.tag }}</span>
      </a>
      {% endfor %}
    </div>
  </section>

</main>
