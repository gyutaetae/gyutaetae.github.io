---
layout: default
---
<main>

  <div class="blog-header">
    <h1>Blog</h1>
    <p>개발, 생각, 그리고 배운 것들을 기록합니다.</p>
  </div>

  <div class="filter-tabs">
    <button class="filter-tab active" data-filter="all">all</button>
    <button class="filter-tab" data-filter="dev">dev</button>
    <button class="filter-tab" data-filter="essay">essay</button>
    <button class="filter-tab" data-filter="til">TIL</button>
  </div>

  <div class="post-list" id="post-list">
    {% for post in site.posts %}
    <a class="post-item" href="{{ post.url | relative_url }}" data-tag="{{ post.tag }}">
      <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
      <span class="post-title">{{ post.title }}</span>
      <span class="post-tag">{{ post.tag }}</span>
    </a>
    {% endfor %}
  </div>

</main>

<script>
  const tabs = document.querySelectorAll('.filter-tab');
  const items = document.querySelectorAll('.post-item');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      const filter = tab.dataset.filter;
      items.forEach(item => {
        const tag = item.dataset.tag;
        item.style.display = (filter === 'all' || tag === filter) ? 'grid' : 'none';
      });
    });
  });
</script>
