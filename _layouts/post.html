---
layout: default
---
<main>

  <a class="back-link" href="{{ '/blog/' | relative_url }}">
    <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    모든 글
  </a>

  <article>
    <header class="post-header">
      <div class="post-meta">
        <span>{{ page.date | date: "%Y-%m-%d" }}</span>
        <span>·</span>
        <span>{{ page.tag }}</span>
        <span>·</span>
        <span>{{ page.read_time | default: "3" }} min read</span>
      </div>
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="subtitle">{{ page.description }}</p>{% endif %}
    </header>

    <div class="post-divider"></div>

    <div class="prose">
      {{ content }}
    </div>
  </article>

</main>
